spring.application.name=com.coustmerservice

# ===============================
# = MySQL Database Configuration
# ===============================

# Database URL (replace DB_NAME, PORT if different)
spring.datasource.url=jdbc:mysql://localhost:3306/ticketbooking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Your MySQL username and password
spring.datasource.username=Kutalagari
spring.datasource.password=Kutalagari

# Driver class name (optional in newer Spring versions)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Optional: Format SQL logs nicely
spring.jpa.properties.hibernate.format_sql=true

